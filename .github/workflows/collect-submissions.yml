# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Collect submissions

# Brings an assignment's grading sheet up to date NOW instead of waiting for the next
# quarter-hour tick: it re-reads each submission repo's latest commit, refills the `info:`
# block (submitted, days late, contributions) and posts any submission receipt still owed.
#
# It never freezes anything. The pin is frozen once, by the cron, at the assignment's
# grading deadline - so a grader can press this as often as they like without moving what
# anyone is marked on. Nothing is written to a student repo except that receipt.

on:
  workflow_dispatch:
    inputs:
      semester_org:
        description: "Semester org (submissions)"
        required: true
        type: choice
        default: "hertie-dsl-demo-f2026"
        options:
          - hertie-dsl-demo-f2025
          - hertie-dsl-demo-f2026
      course_source_repo:
        description: "Course-org repo to hand out from"
        required: true
        type: choice
        default: "assignment-7-f2026"
        options:
          - assignment-1-f2026
          - assignment-2-f2026
          - assignment-3-project-f2026
          - assignment-4-f2026
          - assignment-5-f2026
          - assignment-6-f2026
          - assignment-7-f2026
          - assignment-90-e2e931eef-private
          - assignment-90-e2e931eef-public
          - assignment-90-e2e931eef-student-choice
      assignment:
        description: "Only if two schedule.yml entries share this template: the one to act on (its key)"
        required: false
        default: ""
      preview:
        description: "Preview - show what WOULD be refreshed"
        type: boolean
        default: true

concurrency:
  group: ${{ github.repository }}-collect-submissions
  cancel-in-progress: false

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  collect-submissions:
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: preview
          # No credential left behind in $GITHUB_WORKSPACE/.git/config. Nothing here ever
          # pushes to the checkout - the central repo is public and read-only to these
          # jobs, and every write goes through `gh`/`gh auth setup-git` against ANOTHER
          # repo - so the persisted header buys nothing, and the grading jobs run the
          # student's own code with this directory on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-autograde.txt
      - name: Create the account graded code runs as
        run: |
          id -u dsl-sandbox >/dev/null 2>&1 \
            || sudo useradd --system --no-create-home --shell /usr/sbin/nologin dsl-sandbox
          sudo -n -u dsl-sandbox true
      - name: Collect submissions
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COURSE_ORG: ${{ github.repository_owner }}
          SEMESTER_ORG: ${{ inputs.semester_org }}
          COURSE_SOURCE_REPO: ${{ inputs.course_source_repo }}
          ASSIGNMENT: ${{ inputs.assignment }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          args=(--course-org "$COURSE_ORG" --course-source-repo "$COURSE_SOURCE_REPO" --semester-org "$SEMESTER_ORG" --refresh-only)
          [ -n "$ASSIGNMENT" ] && args+=(--assignment "$ASSIGNMENT")
          if [ "$PREVIEW" = "false" ]; then args+=(--no-preview); else args+=(--preview); fi
          python3 -m dsl_course.collect "${args[@]}"
